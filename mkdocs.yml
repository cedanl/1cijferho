site_name: 1CijferHO
site_description: Verwerk DUO-onderwijsdata naar analyse-klare CSV/Parquet bestanden
site_url: https://cedanl.github.io/1cijferho/
repo_url: https://github.com/cedanl/1cijferho
repo_name: cedanl/1cijferho
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  # Zensical: classic bewaart het Material-uiterlijk waar extra.css op is gebouwd
  variant: classic
  language: nl
  logo: assets/logos/npuls_logo.jpg
  favicon: assets/logos/beeldmerk.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

copyright: >-
  Centrum Educatieve Data Analyse (CEDA) · Onderdeel van <a href="https://npuls.nl/" target="_blank" rel="noopener">Npuls</a> · <a href="https://edu.nl/twt84" target="_blank" rel="noopener">CEDA-community</a> · <a href="mailto:ceda@surf.nl">ceda@surf.nl</a>

plugins:
  - search:
      lang: nl
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Aan de slag: getting-started.md
  - CLI-referentie: cli.md
  - Decodering: decodering.md
  - Migratie outputcontract: outputcontract-migratie.md
  - API-referentie: api/index.md
  - Opslag backends: storage-abstraction.md
  - S3 in CI (SURF): ci-surf-object-store.md
  - SDP & compliance:
      - Overzicht: sdp/index.md
      - Object Store voor de gaps: sdp/object-store-for-gaps.slides.md
      - Vragen voor team SDA: sdp/object-store-questions-for-sda.md
