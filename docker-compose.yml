services:
  app:
    container_name: 1cijferho
    build: .
    ports:
      - "8000:8000"
    environment:
      - STORAGE_BACKEND=${STORAGE_BACKEND:-disk}
      - STORAGE_DISK_BASE_PATH=/app/data
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-1cijferho}
      - MINIO_SECURE=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-cijferho}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      - minio
      - postgres
    volumes:
      - ./src:/app/src
      - ./data:/app/data

  minio:
    container_name: minio
    # `minio/minio` was deleted from Docker Hub and `quay.io/minio/minio` is now
    # auth-gated, so neither official source can be pulled any more. This is a
    # verbatim upstream mirror (same entrypoint/cmd/env), pinned by multi-arch
    # index digest (linux/amd64 + linux/arm64) of RELEASE.2026-08-04T00-00-00Z.
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # Curl rather than `mc ready local`, so the healthcheck does not depend on
      # the MinIO *client* being bundled in the server image. Upstream's
      # Dockerfile.release ships a static curl (COPY /go/bin/curl* /usr/bin/),
      # and the mirror carries it over.
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Replaces the old `minio/mc`-based init service: the mc client is no longer
  # downloadable (dl.min.io is 410 Gone) and `minio/mc` is gone from Docker
  # Hub. Uses the app image, which already ships the `minio` Python client.
  minio-init:
    container_name: minio-init
    build: .
    entrypoint: ["python", "/init/minio_init.py"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-1cijferho}
      - MINIO_SECURE=false
    volumes:
      - ./scripts/minio_init.py:/init/minio_init.py:ro

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-cijferho}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  postgres_data:
