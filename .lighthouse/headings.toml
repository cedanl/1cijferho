nl = "Doorgezet naar de dispatcher. De handoff start de run pas in het nachtvenster; tot dan kun je corrigeren."
en = "Forwarded to the dispatcher. The handoff starts the run only in the night window; until then you can correct it."

[triage_forwarded_now]
nl = "Doorgezet naar de dispatcher; de eerstvolgende tick start het."
en = "Forwarded to the dispatcher; the next tick starts it."

[triage_fix_forwarded]
nl = "Corrigeren: niet naar de dispatcher: zet de status terug naar To do en verwijder de 🤖 Handoff. Opnieuw triëren: zet eerst de status terug naar To do, verwijder dan deze comment en de 🤖 Handoff. Zelf oppakken: zet eerst de status terug naar To do, start dan /lighthouse-start-issue."
en = "To correct: not to the dispatcher: set the status back to To do and delete the 🤖 Handoff. Triage again: first set the status back to To do, then delete this comment and the 🤖 Handoff. Pick it up yourself: first set the status back to To do, then start /lighthouse-start-issue."

[triage_fix_forwarded_now]
nl = "Corrigeren: niet naar de dispatcher: zet de status terug naar To do. Opnieuw triëren: zet eerst de status terug naar To do, verwijder dan deze comment. Zelf oppakken: zet eerst de status terug naar To do, start dan /lighthouse-start-issue."
