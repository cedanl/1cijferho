name: Pipeline integration test

on:
  workflow_call:

jobs:
  snapshot:
    name: "Pipeline config ${{ matrix.config.name }} (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        config:
          - name: csv-raw
            flags: "--skip-decode --skip-enrich --skip-parquet --skip-snake-case"
          - name: csv-decoded-enriched
            flags: "--skip-parquet --skip-snake-case"
          - name: full-pipeline
            flags: ""

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@16ce1475533917ea7f670044db2fa47c6c9f126f # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@f677139edd7d37da08e7d4ef8508e42ca44ea2b27 # v5.1.1
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pipeline (${{ matrix.config.name }})
        shell: bash
        run: |
          uv run eencijferho pipeline \
            --input data/01-input/DEMO \
            --output data/test-output/${{ matrix.config.name }} \
            ${{ matrix.config.flags }}

      - name: Validate snapshot (${{ matrix.config.name }})
        shell: bash
        run: |
          uv run python -m eencijferho.utils.snapshot_validator \
            --output data/test-output/${{ matrix.config.name }} \
            --snapshot snapshots/${{ matrix.config.name }}/snapshot.json \
            --validate
