name: S3 backend tests (SURF object store)

# Exercises the S3 backend against the REAL SURF object store (Ceph
# RADOS-Gateway) using a utility account + bucket. Credentials live in GitHub
# secrets (never in the repo). The job SKIPS itself cleanly when the secrets
# are absent, so it is a no-op until the SURF account is provisioned and does
# not fail on fork PRs (which never receive secrets).
#
# ⚠️ WHY THIS DOES NOT RUN ON PULL REQUESTS / EVERY PUSH:
# The SURF object store (objectstore.surf.nl) is only reachable from the SURF
# network / eduVPN. GitHub-hosted runners have a public cloud IP with NO VPN,
# so they cannot connect to it — a verified run failed with
# botocore EndpointConnectionError on every test (after hanging ~2h42m before
# the backend's connect timeout was added). We therefore do NOT test against
# the real object store in CI. This workflow is manually triggered only
# (workflow_dispatch) and is kept for the future case of a self-hosted runner
# INSIDE the SURF network. Day-to-day, verify against the real store LOCALLY
# from a machine on eduVPN (see docs/ci-surf-object-store.md).
# The always-on S3 coverage in CI runs against MinIO instead (see s3.yml).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SURF_S3_ENDPOINT     e.g. https://objectstore.surf.nl
#   SURF_S3_ACCESS_KEY   utility-account access key
#   SURF_S3_SECRET_KEY   utility-account secret key
#   SURF_S3_BUCKET       dedicated test bucket, e.g. 1cijferho-ci-test
# Optional:
#   SURF_S3_REGION       (defaults to us-east-1; RADOS-GW accepts any)

on:
  workflow_dispatch:

jobs:
  # Gate: only proceed when the endpoint secret is configured.
  check-secrets:
    name: Check SURF credentials present
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.SURF_S3_ENDPOINT }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SURF_S3_ENDPOINT secret not set — skipping the real SURF object store tests."
          fi

  test:
    name: S3 backend tests (SURF)
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      S3_TEST_ENDPOINT: ${{ secrets.SURF_S3_ENDPOINT }}
      S3_TEST_ACCESS_KEY: ${{ secrets.SURF_S3_ACCESS_KEY }}
      S3_TEST_SECRET_KEY: ${{ secrets.SURF_S3_SECRET_KEY }}
      S3_TEST_BUCKET: ${{ secrets.SURF_S3_BUCKET }}
      S3_TEST_REGION: ${{ secrets.SURF_S3_REGION || 'us-east-1' }}
      S3_TEST_SECURE: "true"
      S3_TEST_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies (with s3 extra)
        # minio is included because tests/integration/conftest.py has a
        # module-level import guard that skips the whole dir without it.
        run: uv sync --group dev --extra s3 --extra minio

      - name: Run S3 backend tests against SURF object store
        run: uv run pytest tests/integration/test_s3_backend.py -v
