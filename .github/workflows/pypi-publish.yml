name: Publish Python 🐍 package to PyPI

description: |
  Builds and publishes to PyPI using Trusted Publishing (OIDC).
  Requires a trusted publisher setup in PyPI for this repo/workflow/environment 'pypi'.
  Publishing requires manual approval in the GitHub 'pypi' environment.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@16ce1475533917ea7f670044db2fa47c6c9f126f # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@f677139edd7d37da08e7d4ef8508e42ca44ea2b27 # v5.1.1
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@f677139edd7d37da08e7d4ef8508e42ca44ea2b27 # v5.1.1
        with:
          python-version: '3.13'
      - name: Install build tool
        run: uv pip install build
      - name: Build a binary wheel and a source tarball
        run: uv run python -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@c7d193f32edcadf64f46e6e288e654e3a0dd658c # v4.1.0
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/project/eencijferho/
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@fa0a91b1f4b1149b5e11d3d38477268817d1bba5 # v4.1.0
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ec4ffa32c7e1e71ca6471f39ae8e098e5e6f74f0 # release/v1 (2024-11-12)
