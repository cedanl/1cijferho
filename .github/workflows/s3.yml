name: S3 backend tests (MinIO)

# Exercises the generic boto3 S3 backend against a throwaway MinIO container
# (MinIO is S3-compatible). Needs no credentials — proves the S3 code path on
# every PR. For the real SURF object store, see s3-surf.yml.

on:
  workflow_call:

jobs:
  test:
    name: S3 backend tests (MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          # Mirror, not `minio/minio`: the Docker Hub repo was deleted and the
          # quay.io repo is auth-gated. See minio.yml for the full story.
          # Verbatim upstream image -> `server /data` is unchanged.
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data

          # Wait for MinIO to be ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            echo "Waiting for MinIO... ($i)"
            sleep 1
          done

          # Fail here with a clear message rather than letting the tests
          # report a confusing connection error.
          curl -sf http://localhost:9000/minio/health/live >/dev/null \
            || { echo "MinIO did not become healthy in 30s"; docker logs minio; exit 1; }

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies (with s3 extra)
        # minio is included because tests/integration/conftest.py has a
        # module-level import guard that skips the whole dir without it.
        run: uv sync --group dev --extra s3 --extra minio

      - name: Run S3 backend tests
        run: uv run pytest tests/integration/test_s3_backend.py -v
