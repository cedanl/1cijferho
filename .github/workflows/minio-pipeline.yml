name: MinIO pipeline integration test

on:
  workflow_call:

jobs:
  snapshot:
    name: "MinIO pipeline ${{ matrix.config.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: csv-raw
            flags: "--skip-decode --skip-enrich --skip-parquet --skip-snake-case"
          - name: csv-decoded-enriched
            flags: "--skip-parquet --skip-snake-case"
          - name: full-pipeline
            flags: ""
    env:
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: 1cijferho-pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          # Mirror, not `minio/minio`: the Docker Hub repo was deleted and the
          # quay.io repo is auth-gated. See minio.yml for the full story.
          # Verbatim upstream image -> `server /data` is unchanged.
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data

          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            echo "Waiting for MinIO... ($i)"
            sleep 1
          done

          curl -sf http://localhost:9000/minio/health/live >/dev/null \
            || { echo "MinIO did not become healthy in 30s"; docker logs minio; exit 1; }

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies (with minio extra)
        run: uv sync --group dev --extra minio

      # Replaces the old `mc mb` / `mc cp` step. The mc binary is no longer
      # downloadable (dl.min.io returns 410 Gone) and the `minio/mc` image is
      # gone from Docker Hub, so we use the `minio` Python client that this job
      # already installed. Must run after "Install dependencies".
      - name: Create bucket and upload demo data
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from minio import Minio

          client = Minio(
              "localhost:9000",
              access_key=os.environ["MINIO_ACCESS_KEY"],
              secret_key=os.environ["MINIO_SECRET_KEY"],
              secure=False,
          )
          bucket = os.environ["MINIO_BUCKET"]
          if not client.bucket_exists(bucket):
              client.make_bucket(bucket)

          prefix = "data/01-input/DEMO"
          for src in sorted(Path("data/01-input/DEMO").rglob("*")):
              if src.is_file():
                  dest = f"{prefix}/{src.relative_to('data/01-input/DEMO')}"
                  client.fput_object(bucket, dest, str(src))
                  print(f"  {dest}")

          objects = list(client.list_objects(bucket, prefix=prefix, recursive=True))
          print(f"=== {len(objects)} object(s) in {bucket}/{prefix} ===")
          assert objects, f"no objects uploaded to {bucket}/{prefix}"
          PY

      - name: Run pipeline (${{ matrix.config.name }})
        run: |
          uv run eencijferho pipeline \
            --input data/01-input/DEMO \
            --output data/test-output/${{ matrix.config.name }} \
            ${{ matrix.config.flags }}

      - name: Validate snapshot (${{ matrix.config.name }})
        run: |
          uv run python -m eencijferho.utils.snapshot_validator \
            --output data/test-output/${{ matrix.config.name }} \
            --snapshot snapshots/${{ matrix.config.name }}/snapshot.json \
            --validate
