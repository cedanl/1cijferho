name: Unit tests

on:
  workflow_call:

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@16ce1475533917ea7f670044db2fa47c6c9f126f # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@f677139edd7d37da08e7d4ef8508e42ca44ea2b27 # v5.1.1
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/eencijferho/ -v
