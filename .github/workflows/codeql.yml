name: "CodeQL"

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2d790406f505fbd5f19bc112e036ce43ec54fce6 # v3.25.8
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6c4899d5007f01864caa26bfa9e1400379b86886 # v3.25.8
        with:
          category: "/language:python"
